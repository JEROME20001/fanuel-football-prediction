<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fanuel Football Prediction</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #061326;
      color: #ffffff;
    }

    header {
      background: linear-gradient(135deg, #071a38, #0b4f91);
      padding: 25px 18px;
      text-align: center;
      border-bottom: 1px solid #1e5d9c;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #b9d9ff;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 25px auto;
    }

    .panel {
      background: #0b1d35;
      border: 1px solid #163a62;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,.25);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    input[type="date"] {
      background: #08182d;
      color: white;
      border: 1px solid #2866a0;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      background: #087cff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0567d6;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #08182d;
      color: #b9d9ff;
      display: none;
    }

    .error {
      color: #ff8f8f;
      background: #35131a;
      border: 1px solid #71303a;
    }

    .success {
      color: #9dffbd;
      background: #10351f;
      border: 1px solid #256d3d;
    }

    .matches-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    .matches-header h2 {
      margin: 0;
    }

    .count {
      background: #0d62ae;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    #matches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 15px;
    }

    .match {
      background: #08182d;
      border: 1px solid #17456f;
      border-radius: 12px;
      padding: 16px;
    }

    .league {
      color: #70baff;
      font-size: 13px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .match-time {
      color: #a6b8cc;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      text-align: center;
    }

    .team {
      font-weight: bold;
      line-height: 1.3;
    }

    .vs {
      color: #64b5ff;
      font-weight: bold;
    }

    .analyze-btn {
      width: 100%;
      margin-top: 15px;
    }

    .prediction {
      margin-top: 15px;
      background: #0d2746;
      border-radius: 10px;
      padding: 15px;
      border-left: 4px solid #1688ff;
    }

    .prediction h3 {
      margin-top: 0;
      color: #72bdff;
    }

    .pick {
      font-size: 22px;
      font-weight: bold;
      margin: 8px 0;
    }

    .confidence {
      font-size: 14px;
      color: #bcdcff;
    }

    .probabilities {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .prob {
      background: #08182d;
      padding: 10px;
      border-radius: 7px;
      text-align: center;
    }

    .prob strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
    }

    .stats {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat {
      background: #08182d;
      padding: 10px;
      border-radius: 7px;
      font-size: 13px;
    }

    .history-item {
      border-bottom: 1px solid #193654;
      padding: 12px 0;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #8ea6bd;
    }

    .spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid #ffffff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    footer {
      text-align: center;
      color: #6f8aa4;
      padding: 25px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 22px;
      }

      .probabilities {
        grid-template-columns: 1fr;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      input[type="date"],
      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ Fanuel Football Prediction</h1>
  <p>AI-Assisted Football Analysis & Historical Data</p>
</header>

<div class="container">

  <!-- CONTROL PANEL -->
  <div class="panel">

    <h2>📅 Select Match Date</h2>

    <div class="controls">

      <input
        type="date"
        id="matchDate"
      >

      <button
        id="loadBtn"
        onclick="loadMatches()"
      >
        Load Matches
      </button>

    </div>

    <div
      id="status"
      class="status"
    ></div>

  </div>


  <!-- MATCHES -->
  <div class="panel">

    <div class="matches-header">

      <h2>⚽ Available Matches</h2>

      <div
        id="matchCount"
        class="count"
      >
        0 matches
      </div>

    </div>

    <div id="matches">

      <div class="empty">
        Select a date and click
        <b>Load Matches</b>.
      </div>

    </div>

  </div>


  <!-- PREDICTION HISTORY -->
  <div class="panel">

    <div class="matches-header">

      <h2>🧠 Prediction History</h2>

      <button
        onclick="loadPredictionHistory()"
      >
        Refresh
      </button>

    </div>

    <div id="history">

      <div class="empty">
        No predictions loaded yet.
      </div>

    </div>

  </div>


  <!-- PERFORMANCE -->
  <div class="panel">

    <h2>📊 System Performance</h2>

    <div id="performance">

      <div class="empty">
        Loading performance...
      </div>

    </div>

  </div>

</div>


<footer>
  Fanuel Football Prediction © 2026
</footer>


<script>

  /* =========================
     DATE
  ========================= */

  function getTanzaniaDate() {

    const parts =
      new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: "Africa/Dar_es_Salaam",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }
      ).formatToParts(new Date());

    const obj = {};

    parts.forEach(p => {
      if (p.type !== "literal") {
        obj[p.type] = p.value;
      }
    });

    return `${obj.year}-${obj.month}-${obj.day}`;
  }


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHTML(value) {

    if (value === null ||
        value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================
     STATUS
  ========================= */

  function showStatus(
    message,
    type = ""
  ) {

    const status =
      document.getElementById("status");

    status.style.display = "block";

    status.className =
      "status " + type;

    status.innerHTML = message;
  }


  function hideStatus() {

    const status =
      document.getElementById("status");

    status.style.display = "none";
  }


  /* =========================
     LOAD MATCHES
  ========================= */

  async function loadMatches() {

    const date =
      document.getElementById(
        "matchDate"
      ).value;

    const button =
      document.getElementById(
        "loadBtn"
      );

    const container =
      document.getElementById(
        "matches"
      );

    const count =
      document.getElementById(
        "matchCount"
      );

    if (!date) {

      showStatus(
        "Please select a date first.",
        "error"
      );

      return;
    }

    button.disabled = true;

    button.innerHTML =
      '<span class="spinner"></span>Loading...';

    container.innerHTML = `
      <div class="empty">
        <span class="spinner"></span>
        Loading all available matches...
      </div>
    `;

    count.textContent =
      "Loading...";

    hideStatus();

    try {

      const response =
        await fetch(
          `/api/upcoming?date=${encodeURIComponent(date)}`,
          {
            method: "GET",
            cache: "no-store"
          }
        );

      const text =
        await response.text();

      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(
          "Server returned invalid JSON."
        );
      }

      if (!response.ok) {

        if (response.status === 429) {

          throw new Error(
            data.error ||
            "TheSportsDB is temporarily rate-limiting requests. Please wait and try again."
          );
        }

        throw new Error(
          data.error ||
          `Server error ${response.status}`
        );
      }

      /*
        Support both:
        {matches: [...]}
        and direct [...]
      */

      let matches = [];

      if (Array.isArray(data)) {
        matches = data;
      } else if (
        Array.isArray(data.matches)
      ) {
        matches = data.matches;
      } else if (
        Array.isArray(data.response)
      ) {
        matches = data.response;
      }

      /*
        IMPORTANT:
        NO slice(0,3) here.
        We display ALL matches.
      */

      count.textContent =
        `${matches.length} match${matches.length === 1 ? "" : "es"}`;

      if (!matches.length) {

        container.innerHTML = `
          <div class="empty">
            No football matches were found
            for <b>${escapeHTML(date)}</b>.
          </div>
        `;

        showStatus(
          "No matches were returned by the football data provider for this date.",
          "error"
        );

        return;
      }

      showStatus(
        `Successfully loaded ${matches.length} football matches.`,
        "success"
      );

      container.innerHTML = "";

      /*
        Display EVERY match returned by server.
      */

      matches.forEach(
        (match, index) => {

          const card =
            createMatchCard(
              match,
              index
            );

          container.insertAdjacentHTML(
            "beforeend",
            card
          );

        }
      );

    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="empty">
          ❌ ${escapeHTML(error.message)}
        </div>
      `;

      count.textContent =
        "0 matches";

      showStatus(
        `❌ ${escapeHTML(error.message)}`,
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Load Matches";
    }
  }


  /* =========================
     MATCH CARD
  ========================= */

  function createMatchCard(
    match,
    index
  ) {

    const fixture =
      match.fixture || {};

    const league =
      match.league || {};

    const teams =
      match.teams || {};

    const home =
      teams.home || {};

    const away =
      teams.away || {};

    const date =
      fixture.date || "";

    const time =
      fixture.time || "";

    const status =
      fixture.status || "Scheduled";

    const id =
      fixture.id || "";


    return `
      <div
        class="match"
        id="match-${escapeHTML(id)}"
      >

        <div class="league">
          ${escapeHTML(
            league.name ||
            "Football"
          )}
        </div>

        <div class="match-time">
          📅 ${escapeHTML(date)}
          ${time
            ? ` • 🕒 ${escapeHTML(time)}`
            : ""}
          <br>
          Status:
          ${escapeHTML(status)}
        </div>

        <div class="teams">

          <div class="team">
            ${escapeHTML(
              home.name ||
              "Home"
            )}
          </div>

          <div class="vs">
            VS
          </div>

          <div class="team">
            ${escapeHTML(
              away.name ||
              "Away"
            )}
          </div>

        </div>

        <button
          class="analyze-btn"
          onclick='analyzeMatch(${JSON.stringify(match).replace(/</g, "\\u003c")})'
        >
          🧠 Analyze Match
        </button>

        <div
          id="prediction-${escapeHTML(id)}"
        ></div>

      </div>
    `;
  }


  /* =========================
     ANALYZE MATCH
  ========================= */

  async function analyzeMatch(
    match
  ) {

    const fixture =
      match.fixture || {};

    const fixtureId =
      fixture.id;

    const predictionBox =
      document.getElementById(
        `prediction-${fixtureId}`
      );

    if (!predictionBox) {
      return;
    }

    predictionBox.innerHTML = `
      <div class="prediction">
        <span class="spinner"></span>
        AI is analyzing this match...
        <br><br>
        Checking historical data,
        team form and statistical patterns.
      </div>
    `;

    try {

      const response =
        await fetch(
          "/api/analyze-fixture",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              fixtureId:
                fixtureId
            })
          }
        );

      const text =
        await response.text();

      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(
          "Invalid response from server."
        );
      }

      if (!response.ok) {

        throw new Error(
          data.error ||
          `Analysis failed (${response.status})`
        );
      }

      if (
        !data.prediction
      ) {

        throw new Error(
          "No prediction was returned."
        );
      }

      displayPrediction(
        predictionBox,
        data.prediction
      );

      loadPredictionHistory();

      loadPerformance();

    } catch (error) {

      console.error(error);

      predictionBox.innerHTML = `
        <div class="prediction">
          ❌ Analysis failed:
          ${escapeHTML(
            error.message
          )}
        </div>
      `;
    }
  }


  /* =========================
     DISPLAY PREDICTION
  ========================= */

  function displayPrediction(
    box,
    prediction
  ) {

    const probabilities =
      prediction.probabilities || {};

    const expected =
      prediction.expectedGoals || {};

    const form =
      prediction.form || {};

    const homeForm =
      form.home || {};

    const awayForm =
      form.away || {};


    box.innerHTML = `

      <div class="prediction">

        <h3>
          🧠 AI Prediction
        </h3>

        <div class="pick">
          ${escapeHTML(
            prediction.pick ||
            "N/A"
          )}
        </div>

        <div class="confidence">
          Confidence:
          <b>
            ${escapeHTML(
              prediction.confidence ??
              0
            )}%
          </b>
        </div>


        <div class="probabilities">

          <div class="prob">
            HOME
            <strong>
              ${escapeHTML(
                probabilities.home ??
                0
              )}%
            </strong>
          </div>

          <div class="prob">
            DRAW
            <strong>
              ${escapeHTML(
                probabilities.draw ??
                0
              )}%
            </strong>
          </div>

          <div class="prob">
            AWAY
            <strong>
              ${escapeHTML(
                probabilities.away ??
                0
              )}%
            </strong>
          </div>

        </div>


        <div class="stats">

          <div class="stat">
            <b>Double Chance</b><br>
            ${escapeHTML(
              prediction.doubleChance ||
              "N/A"
            )}
          </div>

          <div class="stat">
            <b>Over 2.5</b><br>
            ${escapeHTML(
              prediction.over25 ??
              0
            )}%
          </div>

          <div class="stat">
            <b>BTTS</b><br>
            ${escapeHTML(
              prediction.btts ??
              0
            )}%
          </div>

          <div class="stat">
            <b>Expected Goals</b><br>
            ${escapeHTML(
              expected.home ??
              0
            )}
            -
            ${escapeHTML(
              expected.away ??
              0
            )}
          </div>

        </div>


        <div class="stats">

          <div class="stat">

            <b>Home Form</b><br>

            Games:
            ${escapeHTML(
              homeForm.games ??
              0
            )}

            <br>

            Wins:
            ${escapeHTML(
              homeForm.wins ??
              0
            )}

            <br>

            Draws:
            ${escapeHTML(
              homeForm.draws ??
              0
            )}

            <br>

            Losses:
            ${escapeHTML(
              homeForm.losses ??
              0
            )}

          </div>


          <div class="stat">

            <b>Away Form</b><br>

            Games:
            ${escapeHTML(
              awayForm.games ??
              0
            )}

            <br>

            Wins:
            ${escapeHTML(
              awayForm.wins ??
              0
            )}

            <br>

            Draws:
            ${escapeHTML(
              awayForm.draws ??
              0
            )}

            <br>

            Losses:
            ${escapeHTML(
              awayForm.losses ??
              0
            )}

          </div>

        </div>


        <div
          style="
            margin-top:12px;
            font-size:12px;
            color:#89a7c2;
          "
        >

          Model:
          ${escapeHTML(
            prediction.model ||
            "Football Analysis"
          )}

          <br>

          Bookmaker odds used:
          <b>
            ${prediction.usesOdds === false
              ? "NO"
              : "YES"}
          </b>

        </div>

      </div>

    `;
  }


  /* =========================
     HISTORY
  ========================= */

  async function loadPredictionHistory() {

    const history =
      document.getElementById(
        "history"
      );

    try {

      const response =
        await fetch(
          "/api/predictions",
          {
            cache: "no-store"
          }
        );

      const data =
        await response.json();

      const predictions =
        data.predictions || [];

      if (!predictions.length) {

        history.innerHTML = `
          <div class="empty">
            No predictions yet.
          </div>
        `;

        return;
      }

      history.innerHTML =
        predictions
          .slice(0, 30)
          .map(p => {

            const result =
              p.result;

            return `
              <div class="history-item">

                <b>
                  ${escapeHTML(
                    p.homeTeam
                  )}
                  vs
                  ${escapeHTML(
                    p.awayTeam
                  )}
                </b>

                <br>

                Pick:
                <b>
                  ${escapeHTML(
                    p.prediction?.pick ||
                    "N/A"
                  )}
                </b>

                <br>

                Confidence:
                ${escapeHTML(
                  p.prediction?.confidence ??
                  0
                )}%

                <br>

                Date:
                ${escapeHTML(
                  p.date || ""
                )}

                ${
                  result
                    ? `
                      <br>
                      Result:
                      ${escapeHTML(
                        result.homeScore
                      )}
                      -
                      ${escapeHTML(
                        result.awayScore
                      )}

                      ${
                        result.correct
                          ? " ✅ Correct"
                          : " ❌ Wrong"
                      }
                    `
                    : ""
                }

              </div>
            `;

          })
          .join("");

    } catch (error) {

      history.innerHTML = `
        <div class="empty">
          Unable to load prediction history.
        </div>
      `;
    }
  }


  /* =========================
     PERFORMANCE
  ========================= */

  async function loadPerformance() {

    const performance =
      document.getElementById(
        "performance"
      );

    try {

      const response =
        await fetch(
          "/api/performance",
          {
            cache: "no-store"
          }
        );

      const data =
        await response.json();

      const p =
        data.performance || {};

      performance.innerHTML = `

        <div class="stats">

          <div class="stat">
            <b>Total Predictions</b><br>
            ${escapeHTML(
              p.totalPredictions ??
              0
            )}
          </div>

          <div class="stat">
            <b>Completed</b><br>
            ${escapeHTML(
              p.completed ??
              0
            )}
          </div>

          <div class="stat">
            <b>Correct</b><br>
            ${escapeHTML(
              p.correct ??
              0
            )}
          </div>

          <div class="stat">
            <b>Accuracy</b><br>
            ${escapeHTML(
              p.accuracy ??
              0
            )}%
          </div>

        </div>

      `;

    } catch (error) {

      performance.innerHTML = `
        <div class="empty">
          Performance unavailable.
        </div>
      `;
    }
  }


  /* =========================
     INITIALIZE
  ========================= */

  document.addEventListener(
    "DOMContentLoaded",
    () => {

      document.getElementById(
        "matchDate"
      ).value =
        getTanzaniaDate();

      loadPredictionHistory();

      loadPerformance();

    }
  );

</script>

</body>
</html>
