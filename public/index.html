<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fanuel Football Prediction</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #071a33;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #0b2f5b;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #1683ff;
    }

    header h1 {
      color: #4db3ff;
      margin-bottom: 8px;
    }

    header p {
      color: #d7e9ff;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .card {
      background: #0d2748;
      border: 1px solid #174d82;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    h2 {
      color: #4db3ff;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #3676ad;
      background: #06172b;
      color: white;
      margin-bottom: 12px;
    }

    button {
      background: #087cff;
      color: white;
      border: none;
      padding: 13px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    button:hover {
      background: #0564d0;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #06172b;
      margin-top: 10px;
    }

    .fixture {
      background: #071d36;
      border: 1px solid #225986;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .fixture strong {
      color: #58b7ff;
    }

    .prediction {
      background: #06172b;
      border-left: 4px solid #1683ff;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
    }

    .big {
      font-size: 25px;
      font-weight: bold;
      color: #4db3ff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .stat {
      background: #09203a;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .stat span {
      display: block;
      color: #9ec9ef;
      margin-bottom: 7px;
    }

    .loading {
      color: #ffd166;
    }

    .error {
      color: #ff7777;
    }

    .success {
      color: #54e38e;
    }

    .info {
      color: #8ecbff;
    }

    .match-count {
      margin-top: 15px;
      color: #9ec9ef;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #8db4d8;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ Fanuel Football Prediction</h1>
  <p>AI-Assisted Football Analysis & Prediction System</p>
</header>

<div class="container">

  <!-- SYSTEM STATUS -->

  <div class="card">

    <h2>System Status</h2>

    <button onclick="checkHealth()">
      Check AI System
    </button>

    <div id="health" class="status">
      Press the button to check the system.
    </div>

  </div>


  <!-- MATCHES -->

  <div class="card">

    <h2>📅 Upcoming Matches</h2>

    <input
      type="date"
      id="matchDate"
    >

    <button onclick="loadMatches()">
      🔄 Load Matches
    </button>

    <div id="matches"></div>

  </div>


  <!-- PREDICTION -->

  <div class="card">

    <h2>🤖 Football Analysis</h2>

    <p>
      Select an upcoming match above to run the prediction model.
    </p>

    <div id="prediction"></div>

  </div>


  <!-- HISTORY -->

  <div class="card">

    <h2>🧠 Prediction History</h2>

    <button onclick="loadHistory()">
      Load Previous Predictions
    </button>

    <div id="history"></div>

  </div>

</div>


<footer>
  Fanuel Football Prediction © 2026
</footer>


<script>

/* =========================
   HEALTH CHECK
========================= */

async function checkHealth() {

  const box =
    document.getElementById("health");

  box.innerHTML =
    '<span class="loading">Checking system...</span>';

  try {

    const response =
      await fetch(
        "/api/health",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (data.ok) {

      box.innerHTML =
        '<span class="success">✓ System is online</span><br>' +
        'Live Data: ' +
        (
          data.liveData
            ? '<span class="success">Connected ✓</span>'
            : '<span class="error">Not connected ✗</span>'
        );

    } else {

      box.innerHTML =
        '<span class="error">System error</span>';

    }

  } catch (error) {

    box.innerHTML =
      '<span class="error">' +
      'Unable to connect to server.' +
      '</span>';

  }

}


/* =========================
   LOAD MATCHES
========================= */

async function loadMatches() {

  const date =
    document.getElementById(
      "matchDate"
    ).value;

  const box =
    document.getElementById(
      "matches"
    );


  if (!date) {

    box.innerHTML =
      '<p class="error">' +
      'Please select a date.' +
      '</p>';

    return;
  }


  box.innerHTML =
    '<p class="loading">' +
    '🔄 Loading football matches...' +
    '</p>';


  try {

    const url =
      "/api/upcoming?date=" +
      encodeURIComponent(date);


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    /*
      Soma response kwanza.
    */

    const raw =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(raw);

    } catch {

      throw new Error(
        "Server ilirudisha data isiyoweza kusomwa."
      );

    }


    /*
      Kama server imerudisha error,
      ionyeshe error halisi.
    */

    if (!response.ok) {

      throw new Error(
        data.error ||
        `Server error: ${response.status}`
      );

    }


    /*
      Tunatarajia array ya fixtures.
    */

    const matches =
      Array.isArray(data)
        ? data
        : data.response;


    if (
      !Array.isArray(matches)
    ) {

      throw new Error(
        "Server haikurudisha fixtures katika format inayotarajiwa."
      );

    }


    /*
      Hakuna mechi.
    */

    if (
      matches.length === 0
    ) {

      box.innerHTML = `

        <div class="fixture">

          <p class="info">
            ⚠️ Hakuna fixture iliyopatikana
            kwa tarehe ${date}.
          </p>

          <br>

          <p>
            Jaribu kuchagua tarehe nyingine.
          </p>

        </div>

      `;

      return;
    }


    /*
      Mechi zimepatikana.
    */

    box.innerHTML = `

      <p class="success match-count">
        ✓ ${matches.length}
        football match(s) found.
      </p>

    `;


    matches
      .slice(0, 50)
      .forEach(
        (match) => {

          const fixture =
            match.fixture || {};

          const league =
            match.league || {};

          const home =
            match.teams?.home || {};

          const away =
            match.teams?.away || {};


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "fixture";


          const matchDate =
            fixture.date
              ? new Date(
                  fixture.date
                ).toLocaleString()
              : "Time unavailable";


          div.innerHTML = `

            <strong>
              ${escapeHTML(
                league.name ||
                "Football"
              )}
            </strong>

            <br><br>

            <span>
              ${escapeHTML(
                home.name ||
                "Home"
              )}
            </span>

            <strong>
              &nbsp; VS &nbsp;
            </strong>

            <span>
              ${escapeHTML(
                away.name ||
                "Away"
              )}
            </span>

            <br><br>

            <small>
              📅 ${escapeHTML(
                matchDate
              )}
            </small>

            <br><br>

            <button>
              🧠 Analyze Match
            </button>

          `;


          const button =
            div.querySelector(
              "button"
            );


          button.onclick =
            () => {

              analyzeMatch(
                fixture
              );

            };


          box.appendChild(
            div
          );

        }
      );


  } catch (error) {

    console.error(
      "LOAD MATCHES ERROR:",
      error
    );


    box.innerHTML = `

      <div class="fixture">

        <p class="error">
          ❌ Failed to load matches.
        </p>

        <br>

        <p class="error">
          ${escapeHTML(
            error.message
          )}
        </p>

        <br>

        <button
          onclick="loadMatches()"
        >
          🔄 Try Again
        </button>

      </div>

    `;

  }

}


/* =========================
   ANALYZE MATCH
========================= */

async function analyzeMatch(
  fixture
) {

  const box =
    document.getElementById(
      "prediction"
    );


  if (
    !fixture ||
    !fixture.id
  ) {

    box.innerHTML =
      '<p class="error">' +
      'Fixture ID haipo.' +
      '</p>';

    return;
  }


  box.innerHTML =
    '<p class="loading">' +
    '🧠 AI is analyzing the match...' +
    '</p>';


  try {

    const response =
      await fetch(
        "/api/analyze-fixture",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              fixtureId:
                fixture.id
            })
        }
      );


    const raw =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(raw);

    } catch {

      throw new Error(
        "Server ilirudisha response isiyosomika."
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Prediction failed"
      );

    }


    const analysis =
      data.analysis;


    if (!analysis) {

      throw new Error(
        "Analysis haikurudishwa na server."
      );

    }


    box.innerHTML = `

      <div class="prediction">

        <h2>
          ${escapeHTML(
            data.home ||
            "Home"
          )}
          vs
          ${escapeHTML(
            data.away ||
            "Away"
          )}
        </h2>

        <p>
          <strong>Prediction:</strong>

          <span class="big">
            ${escapeHTML(
              analysis.pick
            )}
          </span>
        </p>


        <div class="grid">

          <div class="stat">
            <span>Home Win</span>
            <strong>
              ${analysis.probabilities.home}%
            </strong>
          </div>


          <div class="stat">
            <span>Draw</span>
            <strong>
              ${analysis.probabilities.draw}%
            </strong>
          </div>


          <div class="stat">
            <span>Away Win</span>
            <strong>
              ${analysis.probabilities.away}%
            </strong>
          </div>


          <div class="stat">
            <span>Confidence</span>
            <strong>
              ${analysis.confidence}%
            </strong>
          </div>


          <div class="stat">
            <span>Double Chance</span>
            <strong>
              ${analysis.doubleChance}
            </strong>
          </div>


          <div class="stat">
            <span>Over 2.5</span>
            <strong>
              ${analysis.over25}%
            </strong>
          </div>


          <div class="stat">
            <span>BTTS Yes</span>
            <strong>
              ${analysis.bttsYes}%
            </strong>
          </div>


          <div class="stat">
            <span>Expected Goals</span>
            <strong>
              ${analysis.expectedGoals.home}
              -
              ${analysis.expectedGoals.away}
            </strong>
          </div>

        </div>


        <br>


        <p>
          H2H games analyzed:
          <strong>
            ${data.h2hGames || 0}
          </strong>
        </p>


        <br>


        <p class="success">
          ✓ Prediction saved to history.
        </p>

      </div>

    `;


  } catch (error) {

    console.error(
      "ANALYSIS ERROR:",
      error
    );


    box.innerHTML =
      '<p class="error">' +
      escapeHTML(
        error.message
      ) +
      '</p>';

  }

}


/* =========================
   HISTORY
========================= */

async function loadHistory() {

  const box =
    document.getElementById(
      "history"
    );


  box.innerHTML =
    '<p class="loading">' +
    'Loading prediction history...' +
    '</p>';


  try {

    const response =
      await fetch(
        "/api/predictions",
        {
          cache: "no-store"
        }
      );


    const predictions =
      await response.json();


    if (
      !Array.isArray(
        predictions
      ) ||
      predictions.length === 0
    ) {

      box.innerHTML =
        "<p>No predictions recorded yet.</p>";

      return;
    }


    box.innerHTML = "";


    predictions
      .slice(0, 20)
      .forEach(
        item => {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "fixture";


          div.innerHTML = `

            <strong>
              ${escapeHTML(
                item.home
              )}
              VS
              ${escapeHTML(
                item.away
              )}
            </strong>

            <br>

            Prediction:

            <strong>
              ${escapeHTML(
                item.analysis?.pick ||
                "N/A"
              )}
            </strong>

            <br>

            Confidence:

            ${
              item.analysis?.confidence ??
              "N/A"
            }%

            <br>

            Date:

            ${
              item.date
                ? new Date(
                    item.date
                  ).toLocaleString()
                : "N/A"
            }

          `;


          box.appendChild(
            div
          );

        }
      );


  } catch (error) {

    box.innerHTML =
      '<p class="error">' +
      'Failed to load history.' +
      '</p>';

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  value
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(
      value ?? ""
    );

  return div.innerHTML;
}


/* =========================
   TODAY'S DATE
   Tanzania local date
========================= */

function getTanzaniaDate() {

  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:
        "Africa/Dar_es_Salaam",

      year: "numeric",

      month: "2-digit",

      day: "2-digit"
    }
  ).format(
    new Date()
  );

}


document.getElementById(
  "matchDate"
).value =
  getTanzaniaDate();


/* =========================
   AUTO HEALTH CHECK
========================= */

checkHealth();

</script>

</body>
</html>
